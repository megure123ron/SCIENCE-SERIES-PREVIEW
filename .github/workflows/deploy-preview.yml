name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract recovered game ZIP
        run: |
          ZIP_FILE="SCIENCE-SERIES-recovered.zip"
          test -f "$ZIP_FILE" || { echo "ZIP file not found: $ZIP_FILE"; exit 1; }

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          GAME_DIR=""
          while IFS= read -r dir; do
            if [ -d "$dir/physica" ] && [ -d "$dir/chemica" ] && [ -d "$dir/biotica" ]; then
              GAME_DIR="$dir"
              break
            fi
          done < <(find extracted -type d)

          if [ -z "$GAME_DIR" ]; then
            echo "Could not find a folder containing all three games."
            find extracted -maxdepth 6 -print
            exit 1
          fi

          mkdir _site
          cp -R "$GAME_DIR"/. _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
