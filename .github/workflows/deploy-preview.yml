
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract fixed game ZIP
        run: |
          ZIP_FILE="SCIENCE-SERIES-v1.2-web-fixed.zip"
          test -f "$ZIP_FILE" || { echo "ZIP file not found: $ZIP_FILE"; exit 1; }

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          GAME_DIR="$(find extracted -type d -name 'SCIENCE-SERIES-web' -print -quit)"

          if [ -z "$GAME_DIR" ]; then
            echo "SCIENCE-SERIES-web folder not found"
            find extracted -maxdepth 5 -print
            exit 1
          fi

          test -d "$GAME_DIR/physica"
          test -d "$GAME_DIR/chemica"
          test -d "$GAME_DIR/biotica"

          mkdir _site
          cp -R "$GAME_DIR"/. _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
