name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract fixed game ZIP
        run: |
          ZIP_FILE="SCIENCE-SERIES-v1.2-web-fixed.zip"
          test -f "$ZIP_FILE" || { echo "ZIP file not found: $ZIP_FILE"; exit 1; }
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          test -d extracted/SCIENCE-SERIES-web || { echo "Expected SCIENCE-SERIES-web folder not found"; exit 1; }
          mkdir _site
          cp -R extracted/SCIENCE-SERIES-web/. _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
