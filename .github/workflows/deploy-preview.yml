
name: Deploy SCIENCE SERIES Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="SCIENCE-SERIES-v1.2-web.zip"

          if [ ! -s "$ZIP_FILE" ]; then
            echo "::error::SCIENCE-SERIES-v1.2-web.zip が見つかりません。"
            exit 1
          fi

          echo "ZIP file:"
          ls -lh "$ZIP_FILE"

      - name: Extract and validate game files
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="SCIENCE-SERIES-v1.2-web.zip"

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          GAME_DIR=""

          while IFS= read -r dir; do
            if [ -s "$dir/physica/index.html" ] &&
               [ -s "$dir/chemica/index.html" ] &&
               [ -s "$dir/biotica/index.html" ]; then
              GAME_DIR="$dir"
              break
            fi
          done < <(find extracted -type d)

          if [ -z "$GAME_DIR" ]; then
            echo "::error::3つのゲームのHTMLファイルが見つかりません。"
            echo "ZIP内のファイル一覧:"
            find extracted -type f | head -100
            exit 1
          fi

          echo "Game directory: $GAME_DIR"

          mkdir _site

          cp -R "$GAME_DIR/physica" _site/
          cp -R "$GAME_DIR/chemica" _site/
          cp -R "$GAME_DIR/biotica" _site/

          find _site -name '._*' -type f -delete
          find _site -name '__MACOSX' -type d -prune -exec rm -rf {} +

          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="theme-color" content="#101827">
            <title>SCIENCE SERIES</title>
            <style>
              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: #101827;
                color: white;
                font-family: sans-serif;
                padding: 24px;
              }

              main {
                width: min(100%, 560px);
                text-align: center;
              }

              h1 {
                font-size: clamp(30px, 7vw, 46px);
                letter-spacing: 3px;
                margin-bottom: 12px;
              }

              p {
                color: #aab8ca;
                margin-bottom: 36px;
              }

              a {
                display: block;
                margin: 16px 0;
                padding: 22px;
                border: 1px solid #53647c;
                border-radius: 14px;
                color: white;
                text-decoration: none;
                background: #1c2a40;
                font-size: 20px;
                font-weight: bold;
                transition: background 0.2s, transform 0.2s;
              }

              a:hover {
                background: #2b405e;
                transform: translateY(-2px);
              }

              footer {
                margin-top: 36px;
                color: #718198;
                font-size: 12px;
              }
            </style>
          </head>
          <body>
            <main>
              <h1>SCIENCE SERIES</h1>
              <p>Choose your science adventure.</p>

              <a href="./physica/">PHYSICA</a>
              <a href="./chemica/">CHEMICA</a>
              <a href="./biotica/">BIOTICA</a>

              <footer>SCIENCE SERIES PREVIEW</footer>
            </main>
          </body>
          </html>
          EOF

          echo "Prepared files:"
          find _site -type f | sort

          test -s _site/index.html
          test -s _site/physica/index.html
          test -s _site/chemica/index.html
          test -s _site/biotica/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
